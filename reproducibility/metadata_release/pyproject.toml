[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atb-release-metadata"
version = "0.1.0"
description = "Reproducible metadata release tooling for AllTheBacteria"
requires-python = ">=3.10"

[project.scripts]
atb-release-metadata = "atb_release_metadata.cli:main"

[tool.setuptools.packages.find]
include = ["atb_release_metadata*"]

[tool.setuptools.package-data]
atb_release_metadata = ["*.md"]

